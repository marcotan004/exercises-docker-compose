services:
  frontend:
    image: marcotan004/example-frontend
    ports: 
      - 5001:5001
  backend:
    image: marcotan004/example-backend
    environment:
      - REDIS_HOST=redis
      - REQUEST_ORIGIN=http://localhost:5001
    ports: 
      - 8080:8080
  redis:
    image: redis:latest
    restart: unless-stopped