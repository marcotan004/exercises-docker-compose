services:
  frontend:
    image: marcotan004/example-frontend
    ports: 
      - 5001:5001
  backend:
    image: marcotan004/example-backend
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=db
      - REQUEST_ORIGIN=http://localhost:5001
    ports: 
      - 8080:8080
  redis:
    image: redis:latest
    restart: unless-stopped
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      - POSTGRES__USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - ./database:/var/lib/postgresql