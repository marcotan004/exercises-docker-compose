services:
  frontend:
    image: marcotan004/example-frontend
  backend:
    image: marcotan004/example-backend
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=db
      - REQUEST_ORIGIN=http://localhost:8000
  redis:
    image: redis:latest
    restart: unless-stopped
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - ./database:/var/lib/postgresql
  nginx:
    depends_on:
      - frontend
      - backend
    image: nginx
    ports:
    - 8000:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro